<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="備忘曆">
<meta name="theme-color" content="#0f0f0f">
<link rel="manifest" href="manifest.json">
<title>備忘曆</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f0f;
  --surface: #181818;
  --surface2: #222222;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.15);
  --text: #f0ede6;
  --text2: #888880;
  --text3: #555550;
  --accent: #c8b880;
  --accent2: #8ba888;
  --red: #c87060;
  --blue: #7090c8;
  --tag-work-bg: rgba(112,144,200,0.15);
  --tag-work: #7090c8;
  --tag-personal-bg: rgba(139,168,136,0.15);
  --tag-personal: #8ba888;
  --tag-urgent-bg: rgba(200,112,96,0.15);
  --tag-urgent: #c87060;
  --radius: 12px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; overflow: hidden; }
.app { display: flex; flex-direction: column; height: 100%; padding-top: var(--safe-top); }
.topbar { padding: 16px 20px 12px; border-bottom: 0.5px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.app-title { font-family: 'Noto Serif TC', serif; font-size: 20px; font-weight: 600; color: var(--accent); letter-spacing: 0.02em; }
.app-subtitle { font-size: 11px; color: var(--text3); margin-top: 2px; letter-spacing: 0.08em; }
.add-btn-top { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform 0.15s; }
.add-btn-top:active { transform: scale(0.9); }
.add-btn-top svg { color: #0f0f0f; }
.tabs { display: flex; padding: 0 20px; gap: 0; border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
.tab { flex: 1; padding: 12px 0; font-size: 12px; letter-spacing: 0.06em; color: var(--text2); background: none; border: none; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -0.5px; transition: all 0.2s; text-align: center; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.view { flex: 1; overflow: hidden; display: none; }
.view.active { display: flex; flex-direction: column; }
.cal-wrap { flex: 1; overflow-y: auto; padding: 16px 16px calc(20px + var(--safe-bottom)); }
.cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.cal-nav-btn { background: none; border: 0.5px solid var(--border2); color: var(--text2); border-radius: 8px; padding: 6px 14px; font-family: inherit; font-size: 14px; cursor: pointer; }
.cal-nav-btn:active { background: var(--surface2); }
.cal-month-label { font-family: 'Noto Serif TC', serif; font-size: 17px; color: var(--text); }
.cal-dow-row { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 4px; }
.cal-dow { text-align: center; font-size: 10px; color: var(--text3); padding: 4px 0; letter-spacing: 0.04em; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal-day { min-height: 52px; border-radius: 8px; padding: 5px 4px 4px; font-size: 13px; color: var(--text2); border: 0.5px solid transparent; position: relative; display: flex; flex-direction: column; }
.cal-day.other { color: var(--text3); }
.cal-day.today { background: rgba(200,184,128,0.08); border-color: rgba(200,184,128,0.3); color: var(--accent); }
.cal-day.today .day-num { font-weight: 600; }
.cal-day.has-memo { border-color: var(--border); background: var(--surface); }
.day-num { font-size: 12px; margin-bottom: 2px; }
.day-dots { display: flex; gap: 2px; flex-wrap: wrap; }
.dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.dot-work { background: var(--tag-work); }
.dot-personal { background: var(--tag-personal); }
.dot-urgent { background: var(--tag-urgent); }
.dot-none { background: var(--text3); }
.memo-wrap { flex: 1; overflow-y: auto; padding: 12px 16px calc(20px + var(--safe-bottom)); }
.filter-row { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.filter-chip { font-size: 11px; padding: 5px 12px; border-radius: 20px; border: 0.5px solid var(--border2); background: none; color: var(--text2); cursor: pointer; font-family: inherit; letter-spacing: 0.04em; transition: all 0.15s; }
.filter-chip.active { background: var(--surface2); color: var(--text); border-color: var(--border2); }
.filter-chip.f-work.active { color: var(--tag-work); border-color: var(--tag-work); background: var(--tag-work-bg); }
.filter-chip.f-personal.active { color: var(--tag-personal); border-color: var(--tag-personal); background: var(--tag-personal-bg); }
.filter-chip.f-urgent.active { color: var(--tag-urgent); border-color: var(--tag-urgent); background: var(--tag-urgent-bg); }
.section-label { font-size: 10px; color: var(--text3); letter-spacing: 0.1em; margin-bottom: 8px; margin-top: 4px; }
.memo-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px 14px 12px; margin-bottom: 8px; position: relative; transition: border-color 0.15s; }
.memo-card.done { opacity: 0.45; }
.memo-card-top { display: flex; align-items: flex-start; gap: 10px; }
.check-btn { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--border2); background: none; cursor: pointer; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.check-btn.checked { background: var(--accent2); border-color: var(--accent2); }
.check-btn.checked::after { content: ''; width: 6px; height: 4px; border-left: 1.5px solid #0f0f0f; border-bottom: 1.5px solid #0f0f0f; transform: rotate(-45deg) translateY(-1px); display: block; }
.memo-title { font-size: 15px; color: var(--text); flex: 1; line-height: 1.4; word-break: break-all; }
.memo-desc { font-size: 12px; color: var(--text2); margin-top: 5px; margin-left: 30px; line-height: 1.6; }
.memo-meta { display: flex; align-items: center; gap: 8px; margin-top: 8px; margin-left: 30px; flex-wrap: wrap; }
.memo-tag { font-size: 10px; padding: 2px 8px; border-radius: 10px; letter-spacing: 0.04em; }
.memo-tag.work { background: var(--tag-work-bg); color: var(--tag-work); }
.memo-tag.personal { background: var(--tag-personal-bg); color: var(--tag-personal); }
.memo-tag.urgent { background: var(--tag-urgent-bg); color: var(--tag-urgent); }
.memo-due { font-size: 11px; color: var(--text3); }
.memo-due.today { color: var(--red); }
.memo-due.overdue { color: var(--red); opacity: 0.7; }
.del-btn { position: absolute; top: 10px; right: 10px; background: none; border: none; color: var(--text3); cursor: pointer; padding: 4px 6px; font-size: 14px; line-height: 1; border-radius: 6px; }
.del-btn:active { background: var(--surface2); color: var(--red); }
.empty { text-align: center; padding: 48px 20px; color: var(--text3); font-size: 13px; line-height: 2; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
.overlay.open { opacity: 1; pointer-events: all; }
.sheet { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 0.5px solid var(--border2); border-radius: 20px 20px 0 0; z-index: 101; padding: 0 20px calc(20px + var(--safe-bottom)); transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.32,0.72,0,1); max-height: 90vh; overflow-y: auto; }
.sheet.open { transform: translateY(0); }
.sheet-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 12px auto 20px; }
.sheet-title { font-family: 'Noto Serif TC', serif; font-size: 17px; color: var(--accent); margin-bottom: 20px; }
.field-label { font-size: 11px; color: var(--text3); letter-spacing: 0.08em; margin-bottom: 6px; }
.field { margin-bottom: 16px; }
.inp { width: 100%; background: var(--surface2); border: 0.5px solid var(--border2); border-radius: 10px; padding: 12px 14px; font-size: 15px; color: var(--text); font-family: 'DM Mono', monospace; outline: none; -webkit-appearance: none; }
.inp:focus { border-color: rgba(200,184,128,0.4); }
textarea.inp { height: 80px; resize: none; }
.tag-select { display: flex; gap: 8px; }
.tag-opt { flex: 1; padding: 9px 0; border-radius: 10px; border: 0.5px solid var(--border); background: none; font-family: inherit; font-size: 12px; color: var(--text2); cursor: pointer; text-align: center; transition: all 0.15s; }
.tag-opt.sel-work { background: var(--tag-work-bg); border-color: var(--tag-work); color: var(--tag-work); }
.tag-opt.sel-personal { background: var(--tag-personal-bg); border-color: var(--tag-personal); color: var(--tag-personal); }
.tag-opt.sel-urgent { background: var(--tag-urgent-bg); border-color: var(--tag-urgent); color: var(--tag-urgent); }
.submit-btn { width: 100%; padding: 15px; background: var(--accent); color: #0f0f0f; border: none; border-radius: var(--radius); font-size: 15px; font-family: 'Noto Serif TC', serif; font-weight: 600; cursor: pointer; margin-top: 8px; transition: opacity 0.15s; }
.submit-btn:active { opacity: 0.8; }
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div>
      <div class="app-title">備忘曆</div>
      <div class="app-subtitle">MEMO · CALENDAR</div>
    </div>
    <button class="add-btn-top" onclick="openSheet()" aria-label="新增備忘錄">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <line x1="9" y1="3" x2="9" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <line x1="3" y1="9" x2="15" y2="9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('cal')">行事曆</button>
    <button class="tab" onclick="switchTab('memo')">備忘錄</button>
  </div>
  <div class="view active" id="view-cal">
    <div class="cal-wrap">
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="changeMonth(-1)">&#8249;</button>
        <span class="cal-month-label" id="cal-month"></span>
        <button class="cal-nav-btn" onclick="changeMonth(1)">&#8250;</button>
      </div>
      <div class="cal-dow-row">
        <div class="cal-dow">日</div><div class="cal-dow">一</div><div class="cal-dow">二</div>
        <div class="cal-dow">三</div><div class="cal-dow">四</div><div class="cal-dow">五</div><div class="cal-dow">六</div>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
  </div>
  <div class="view" id="view-memo">
    <div class="memo-wrap">
      <div class="filter-row">
        <button class="filter-chip active" data-filter="all" onclick="setFilter(this)">全部</button>
        <button class="filter-chip f-work" data-filter="work" onclick="setFilter(this)">工作</button>
        <button class="filter-chip f-personal" data-filter="personal" onclick="setFilter(this)">個人</button>
        <button class="filter-chip f-urgent" data-filter="urgent" onclick="setFilter(this)">緊急</button>
      </div>
      <div id="memo-list"></div>
    </div>
  </div>
</div>
<div class="overlay" id="overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">新增備忘錄</div>
  <div class="field">
    <div class="field-label">標題</div>
    <input class="inp" type="text" id="inp-title" placeholder="備忘錄標題...">
  </div>
  <div class="field">
    <div class="field-label">內容（選填）</div>
    <textarea class="inp" id="inp-desc" placeholder="詳細說明..."></textarea>
  </div>
  <div class="field">
    <div class="field-label">到期日</div>
    <input class="inp" type="date" id="inp-date">
  </div>
  <div class="field">
    <div class="field-label">標籤</div>
    <div class="tag-select">
      <button class="tag-opt sel-work" data-tag="work" onclick="pickTag(this)">工作</button>
      <button class="tag-opt" data-tag="personal" onclick="pickTag(this)">個人</button>
      <button class="tag-opt" data-tag="urgent" onclick="pickTag(this)">緊急</button>
    </div>
  </div>
  <button class="submit-btn" onclick="addMemo()">新增</button>
</div>
<script>
let memos = JSON.parse(localStorage.getItem('memos') || '[]');
let selectedTag = 'work';
let currentFilter = 'all';
const today = new Date();
const todayStr = today.toISOString().split('T')[0];
let viewYear = today.getFullYear();
let viewMonth = today.getMonth();
function save() { localStorage.setItem('memos', JSON.stringify(memos)); }
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', (i === 0) === (tab === 'cal')));
  document.getElementById('view-cal').classList.toggle('active', tab === 'cal');
  document.getElementById('view-memo').classList.toggle('active', tab === 'memo');
}
function openSheet() {
  document.getElementById('inp-date').value = todayStr;
  document.getElementById('inp-title').value = '';
  document.getElementById('inp-desc').value = '';
  document.getElementById('overlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
  setTimeout(() => document.getElementById('inp-title').focus(), 350);
}
function closeSheet() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}
function pickTag(el) {
  document.querySelectorAll('.tag-opt').forEach(t => t.className = 'tag-opt');
  selectedTag = el.dataset.tag;
  el.classList.add('sel-' + selectedTag);
}
function addMemo() {
  const title = document.getElementById('inp-title').value.trim();
  if (!title) { document.getElementById('inp-title').focus(); return; }
  const memo = { id: Date.now(), title, desc: document.getElementById('inp-desc').value.trim(), date: document.getElementById('inp-date').value, tag: selectedTag, done: false, created: todayStr };
  memos.unshift(memo);
  save(); renderMemos(); renderCalendar(); closeSheet();
}
function deleteMemo(id) {
  if (!confirm('刪除這則備忘錄？')) return;
  memos = memos.filter(m => m.id !== id);
  save(); renderMemos(); renderCalendar();
}
function toggleDone(id) {
  const m = memos.find(m => m.id === id);
  if (m) { m.done = !m.done; save(); renderMemos(); renderCalendar(); }
}
function setFilter(el) {
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  currentFilter = el.dataset.filter;
  renderMemos();
}
function dueLabel(dateStr) {
  if (!dateStr) return null;
  if (dateStr === todayStr) return { text: '今天到期', cls: 'today' };
  if (dateStr < todayStr) return { text: '逾期 ' + dateStr, cls: 'overdue' };
  return { text: '到期 ' + dateStr, cls: '' };
}
function tagLabel(tag) { return { work: '工作', personal: '個人', urgent: '緊急' }[tag] || tag; }
function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderMemos() {
  const el = document.getElementById('memo-list');
  let list = currentFilter === 'all' ? memos : memos.filter(m => m.tag === currentFilter);
  const active = list.filter(m => !m.done);
  const done = list.filter(m => m.done);
  if (!list.length) { el.innerHTML = '<div class="empty">尚無備忘錄<br>點右上角 + 新增</div>'; return; }
  const renderCard = m => {
    const due = dueLabel(m.date);
    return `<div class="memo-card ${m.done?'done':''}">
      <div class="memo-card-top">
        <button class="check-btn ${m.done?'checked':''}" onclick="toggleDone(${m.id})"></button>
        <span class="memo-title">${escHtml(m.title)}</span>
      </div>
      ${m.desc?`<div class="memo-desc">${escHtml(m.desc)}</div>`:''}
      <div class="memo-meta">
        ${m.tag?`<span class="memo-tag ${m.tag}">${tagLabel(m.tag)}</span>`:''}
        ${due?`<span class="memo-due ${due.cls}">${due.text}</span>`:''}
      </div>
      <button class="del-btn" onclick="deleteMemo(${m.id})">✕</button>
    </div>`;
  };
  let html = '';
  if (active.length) html += `<div class="section-label">進行中 · ${active.length}</div>` + active.map(renderCard).join('');
  if (done.length) html += `<div class="section-label" style="margin-top:16px;">已完成 · ${done.length}</div>` + done.map(renderCard).join('');
  el.innerHTML = html;
}
function renderCalendar() {
  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('cal-month').textContent = `${viewYear} 年 ${monthNames[viewMonth]}`;
  const first = new Date(viewYear, viewMonth, 1).getDay();
  const days = new Date(viewYear, viewMonth + 1, 0).getDate();
  const prevDays = new Date(viewYear, viewMonth, 0).getDate();
  const memoMap = {};
  memos.filter(m => !m.done && m.date).forEach(m => { if (!memoMap[m.date]) memoMap[m.date] = []; memoMap[m.date].push(m); });
  let html = '';
  for (let i = 0; i < first; i++) html += `<div class="cal-day other"><div class="day-num">${prevDays-first+1+i}</div></div>`;
  for (let d = 1; d <= days; d++) {
    const ds = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = ds === todayStr;
    const dayMemos = memoMap[ds] || [];
    const dots = dayMemos.slice(0,5).map(m => {
      const cls = m.tag==='work'?'dot-work':m.tag==='personal'?'dot-personal':m.tag==='urgent'?'dot-urgent':'dot-none';
      return `<span class="dot ${cls}"></span>`;
    }).join('');
    html += `<div class="cal-day ${isToday?'today':''} ${dayMemos.length?'has-memo':''}"><div class="day-num">${d}</div>${dots?`<div class="day-dots">${dots}</div>`:''}</div>`;
  }
  const remain = 42 - first - days;
  for (let d = 1; d <= remain; d++) html += `<div class="cal-day other"><div class="day-num">${d}</div></div>`;
  document.getElementById('cal-grid').innerHTML = html;
}
function changeMonth(d) {
  viewMonth += d;
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  renderCalendar();
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
renderCalendar();
renderMemos();
</script>
</body>
</html>
