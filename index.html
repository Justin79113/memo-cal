<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="備忘曆">
<meta name="theme-color" content="#0f0f0f">
<link rel="manifest" href="manifest.json">
<title>備忘曆</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0f0f0f;--surface:#181818;--surface2:#222222;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.15);
  --text:#f0ede6;--text2:#888880;--text3:#555550;
  --accent:#c8b880;--accent2:#8ba888;--red:#c87060;
  --tag-work-bg:rgba(112,144,200,0.15);--tag-work:#7090c8;
  --tag-personal-bg:rgba(139,168,136,0.15);--tag-personal:#8ba888;
  --tag-urgent-bg:rgba(200,112,96,0.15);--tag-urgent:#c87060;
  --radius:12px;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;overflow:hidden;}
.app{display:flex;flex-direction:column;height:100%;padding-top:var(--safe-top);}
.topbar{padding:16px 20px 12px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.app-title{font-family:'Noto Serif TC',serif;font-size:20px;font-weight:600;color:var(--accent);letter-spacing:.02em;}
.app-subtitle{font-size:11px;color:var(--text3);margin-top:2px;letter-spacing:.08em;}
.add-btn-top{width:36px;height:36px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s;}
.add-btn-top:active{transform:scale(.9);}
.add-btn-top svg{color:#0f0f0f;}
.tabs{display:flex;padding:0 20px;border-bottom:0.5px solid var(--border);flex-shrink:0;}
.tab{flex:1;padding:12px 0;font-size:12px;letter-spacing:.06em;color:var(--text2);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-0.5px;transition:all .2s;text-align:center;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.view{flex:1;overflow:hidden;display:none;}
.view.active{display:flex;flex-direction:column;}

/* Calendar */
.cal-wrap{flex:1;overflow-y:auto;padding:14px 10px 12px;}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-nav-btn{background:none;border:0.5px solid var(--border2);color:var(--text2);border-radius:8px;padding:6px 14px;font-family:inherit;font-size:14px;cursor:pointer;}
.cal-nav-btn:active{background:var(--surface2);}
.cal-month-label{font-family:'Noto Serif TC',serif;font-size:17px;color:var(--text);}
.cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:3px;}
.cal-dow{text-align:center;font-size:10px;color:var(--text3);padding:3px 0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cal-day{min-height:66px;border-radius:7px;padding:4px 3px 3px;color:var(--text2);border:0.5px solid transparent;display:flex;flex-direction:column;gap:2px;overflow:hidden;cursor:pointer;}
.cal-day.other{color:var(--text3);}
.cal-day.today{background:rgba(200,184,128,.08);border-color:rgba(200,184,128,.3);color:var(--accent);}
.cal-day.today .day-num{font-weight:600;}
.cal-day.has-memo{border-color:var(--border);background:var(--surface);}
.cal-day.selected{outline:1.5px solid var(--accent);}
.day-num{font-size:11px;margin-bottom:1px;flex-shrink:0;padding-left:2px;}
.day-item{font-size:9px;line-height:1.25;padding:1px 3px;border-radius:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;width:100%;display:flex;align-items:center;gap:2px;}
.day-item.work{background:var(--tag-work-bg);color:var(--tag-work);}
.day-item.personal{background:var(--tag-personal-bg);color:var(--tag-personal);}
.day-item.urgent{background:var(--tag-urgent-bg);color:var(--tag-urgent);}
.day-item.none{background:rgba(255,255,255,.06);color:var(--text2);}
.day-item-time{opacity:.7;flex-shrink:0;}
.day-more{font-size:9px;color:var(--text3);padding-left:3px;}

/* Day detail */
.day-detail{background:var(--surface);border-top:0.5px solid var(--border2);padding:12px 16px calc(12px + var(--safe-bottom));max-height:40%;overflow-y:auto;flex-shrink:0;}
.day-detail-title{font-size:13px;color:var(--accent);margin-bottom:8px;font-family:'Noto Serif TC',serif;}
.detail-item{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--border);}
.detail-item:last-child{border-bottom:none;}
.detail-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.detail-dot.work{background:var(--tag-work);}
.detail-dot.personal{background:var(--tag-personal);}
.detail-dot.urgent{background:var(--tag-urgent);}
.detail-dot.none{background:var(--text3);}
.detail-info{flex:1;}
.detail-title{font-size:13px;color:var(--text);}
.detail-meta{font-size:11px;color:var(--text2);margin-top:2px;}
.detail-repeat{font-size:10px;color:var(--accent);margin-top:2px;}

/* Memo list */
.memo-wrap{flex:1;overflow-y:auto;padding:12px 16px calc(20px + var(--safe-bottom));}
.filter-row{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.filter-chip{font-size:11px;padding:5px 12px;border-radius:20px;border:0.5px solid var(--border2);background:none;color:var(--text2);cursor:pointer;font-family:inherit;transition:all .15s;}
.filter-chip.active{background:var(--surface2);color:var(--text);}
.filter-chip.f-work.active{color:var(--tag-work);border-color:var(--tag-work);background:var(--tag-work-bg);}
.filter-chip.f-personal.active{color:var(--tag-personal);border-color:var(--tag-personal);background:var(--tag-personal-bg);}
.filter-chip.f-urgent.active{color:var(--tag-urgent);border-color:var(--tag-urgent);background:var(--tag-urgent-bg);}
.section-label{font-size:10px;color:var(--text3);letter-spacing:.1em;margin-bottom:8px;margin-top:4px;}
.memo-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);padding:13px 13px 11px;margin-bottom:8px;position:relative;}
.memo-card.done{opacity:.45;}
.memo-card-top{display:flex;align-items:flex-start;gap:10px;}
.check-btn{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border2);background:none;cursor:pointer;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.check-btn.checked{background:var(--accent2);border-color:var(--accent2);}
.check-btn.checked::after{content:'';width:6px;height:4px;border-left:1.5px solid #0f0f0f;border-bottom:1.5px solid #0f0f0f;transform:rotate(-45deg) translateY(-1px);display:block;}
.memo-title{font-size:15px;color:var(--text);flex:1;line-height:1.4;word-break:break-all;}
.memo-desc{font-size:12px;color:var(--text2);margin-top:5px;margin-left:30px;line-height:1.6;}
.memo-meta{display:flex;align-items:center;gap:6px;margin-top:7px;margin-left:30px;flex-wrap:wrap;}
.memo-tag{font-size:10px;padding:2px 7px;border-radius:10px;}
.memo-tag.work{background:var(--tag-work-bg);color:var(--tag-work);}
.memo-tag.personal{background:var(--tag-personal-bg);color:var(--tag-personal);}
.memo-tag.urgent{background:var(--tag-urgent-bg);color:var(--tag-urgent);}
.memo-date{font-size:11px;color:var(--text3);}
.memo-date.today{color:var(--red);}
.memo-repeat-badge{font-size:10px;color:var(--accent);background:rgba(200,184,128,.1);padding:1px 6px;border-radius:8px;}
.del-btn{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--text3);cursor:pointer;padding:4px 6px;font-size:14px;border-radius:6px;}
.del-btn:active{background:var(--surface2);color:var(--red);}
.empty{text-align:center;padding:48px 20px;color:var(--text3);font-size:13px;line-height:2;}

/* Sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;opacity:0;pointer-events:none;transition:opacity .25s;}
.overlay.open{opacity:1;pointer-events:all;}
.sheet{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:0.5px solid var(--border2);border-radius:20px 20px 0 0;z-index:101;padding:0 20px calc(20px + var(--safe-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:92vh;overflow-y:auto;}
.sheet.open{transform:translateY(0);}
.sheet-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 18px;}
.sheet-title{font-family:'Noto Serif TC',serif;font-size:17px;color:var(--accent);margin-bottom:18px;}
.field{margin-bottom:14px;}
.field-label{font-size:11px;color:var(--text3);letter-spacing:.08em;margin-bottom:5px;}
.inp{width:100%;background:var(--surface2);border:0.5px solid var(--border2);border-radius:10px;padding:11px 13px;font-size:15px;color:var(--text);font-family:'DM Mono',monospace;outline:none;-webkit-appearance:none;}
.inp:focus{border-color:rgba(200,184,128,.4);}
textarea.inp{height:72px;resize:none;}
.row2{display:flex;gap:8px;}
.row2 .inp{flex:1;}
.tag-select{display:flex;gap:8px;}
.tag-opt{flex:1;padding:9px 0;border-radius:10px;border:0.5px solid var(--border);background:none;font-family:inherit;font-size:12px;color:var(--text2);cursor:pointer;text-align:center;transition:all .15s;}
.tag-opt.sel-work{background:var(--tag-work-bg);border-color:var(--tag-work);color:var(--tag-work);}
.tag-opt.sel-personal{background:var(--tag-personal-bg);border-color:var(--tag-personal);color:var(--tag-personal);}
.tag-opt.sel-urgent{background:var(--tag-urgent-bg);border-color:var(--tag-urgent);color:var(--tag-urgent);}
.repeat-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.repeat-opt{padding:8px 4px;border-radius:8px;border:0.5px solid var(--border);background:none;font-family:inherit;font-size:11px;color:var(--text2);cursor:pointer;text-align:center;transition:all .15s;}
.repeat-opt.active{background:rgba(200,184,128,.12);border-color:var(--accent);color:var(--accent);}
.custom-interval{display:none;margin-top:8px;align-items:center;gap:8px;}
.custom-interval.show{display:flex;}
.interval-label{font-size:12px;color:var(--text2);white-space:nowrap;}
.submit-btn{width:100%;padding:15px;background:var(--accent);color:#0f0f0f;border:none;border-radius:var(--radius);font-size:15px;font-family:'Noto Serif TC',serif;font-weight:600;cursor:pointer;margin-top:10px;transition:opacity .15s;}
.submit-btn:active{opacity:.8;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div>
      <div class="app-title">備忘曆</div>
      <div class="app-subtitle">MEMO · CALENDAR</div>
    </div>
    <button class="add-btn-top" onclick="openSheet()" aria-label="新增">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <line x1="9" y1="3" x2="9" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <line x1="3" y1="9" x2="15" y2="9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('cal')">行事曆</button>
    <button class="tab" onclick="switchTab('memo')">備忘錄</button>
  </div>

  <div class="view active" id="view-cal">
    <div class="cal-wrap">
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="changeMonth(-1)">&#8249;</button>
        <span class="cal-month-label" id="cal-month"></span>
        <button class="cal-nav-btn" onclick="changeMonth(1)">&#8250;</button>
      </div>
      <div class="cal-dow-row">
        <div class="cal-dow">日</div><div class="cal-dow">一</div><div class="cal-dow">二</div>
        <div class="cal-dow">三</div><div class="cal-dow">四</div><div class="cal-dow">五</div><div class="cal-dow">六</div>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
    <div class="day-detail" id="day-detail" style="display:none;">
      <div class="day-detail-title" id="day-detail-title"></div>
      <div id="day-detail-list"></div>
    </div>
  </div>

  <div class="view" id="view-memo">
    <div class="memo-wrap">
      <div class="filter-row">
        <button class="filter-chip active" data-filter="all" onclick="setFilter(this)">全部</button>
        <button class="filter-chip f-work" data-filter="work" onclick="setFilter(this)">工作</button>
        <button class="filter-chip f-personal" data-filter="personal" onclick="setFilter(this)">個人</button>
        <button class="filter-chip f-urgent" data-filter="urgent" onclick="setFilter(this)">緊急</button>
      </div>
      <div id="memo-list"></div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">新增備忘錄</div>
  <div class="field">
    <div class="field-label">標題</div>
    <input class="inp" type="text" id="inp-title" placeholder="備忘錄標題...">
  </div>
  <div class="field">
    <div class="field-label">內容（選填）</div>
    <textarea class="inp" id="inp-desc" placeholder="詳細說明..."></textarea>
  </div>
  <div class="field">
    <div class="field-label">日期與時間</div>
    <div class="row2">
      <input class="inp" type="date" id="inp-date">
      <input class="inp" type="time" id="inp-time">
    </div>
  </div>
  <div class="field">
    <div class="field-label">重複</div>
    <div class="repeat-opts">
      <button class="repeat-opt active" data-repeat="none" onclick="pickRepeat(this)">不重複</button>
      <button class="repeat-opt" data-repeat="daily" onclick="pickRepeat(this)">每天</button>
      <button class="repeat-opt" data-repeat="weekly" onclick="pickRepeat(this)">每週</button>
      <button class="repeat-opt" data-repeat="monthly" onclick="pickRepeat(this)">每月</button>
      <button class="repeat-opt" data-repeat="yearly" onclick="pickRepeat(this)">每年</button>
      <button class="repeat-opt" data-repeat="custom" onclick="pickRepeat(this)">自訂</button>
    </div>
    <div class="custom-interval" id="custom-interval">
      <span class="interval-label">每</span>
      <input class="inp" type="number" id="inp-interval" value="1" min="1" max="999" style="width:64px;flex:none;padding:8px;">
      <select class="inp" id="inp-interval-unit" style="flex:1;">
        <option value="day">天</option>
        <option value="week">週</option>
        <option value="month">月</option>
        <option value="year">年</option>
      </select>
      <span class="interval-label">一次</span>
    </div>
  </div>
  <div class="field">
    <div class="field-label">標籤</div>
    <div class="tag-select">
      <button class="tag-opt sel-work" data-tag="work" onclick="pickTag(this)">工作</button>
      <button class="tag-opt" data-tag="personal" onclick="pickTag(this)">個人</button>
      <button class="tag-opt" data-tag="urgent" onclick="pickTag(this)">緊急</button>
    </div>
  </div>
  <button class="submit-btn" onclick="addMemo()">新增</button>
</div>

<script>
let memos = JSON.parse(localStorage.getItem('memos') || '[]');
let selectedTag = 'work', selectedRepeat = 'none', currentFilter = 'all', selectedDay = null;
const today = new Date();
const todayStr = today.toISOString().split('T')[0];
let viewYear = today.getFullYear(), viewMonth = today.getMonth();

function save() { localStorage.setItem('memos', JSON.stringify(memos)); }

function repeatLabel(m) {
  if (!m.repeat || m.repeat === 'none') return null;
  const map = { daily:'每天', weekly:'每週', monthly:'每月', yearly:'每年' };
  if (m.repeat === 'custom') {
    const u = { day:'天', week:'週', month:'月', year:'年' };
    return `每 ${m.repeatInterval} ${u[m.repeatUnit]}`;
  }
  return map[m.repeat];
}

function memoOccursOn(m, dateStr) {
  if (!m.date) return false;
  if (!m.repeat || m.repeat === 'none') return m.date === dateStr;
  const start = new Date(m.date + 'T00:00:00');
  const target = new Date(dateStr + 'T00:00:00');
  if (target < start) return false;
  const diffDays = Math.round((target - start) / 86400000);
  if (m.repeat === 'daily') return true;
  if (m.repeat === 'weekly') return diffDays % 7 === 0;
  if (m.repeat === 'monthly') return target.getDate() === start.getDate();
  if (m.repeat === 'yearly') return target.getDate() === start.getDate() && target.getMonth() === start.getMonth();
  if (m.repeat === 'custom') {
    const n = parseInt(m.repeatInterval) || 1;
    const unit = m.repeatUnit || 'day';
    if (unit === 'day') return diffDays % n === 0;
    if (unit === 'week') return diffDays % (n * 7) === 0;
    if (unit === 'month') {
      if (target.getDate() !== start.getDate()) return false;
      const md = (target.getFullYear() - start.getFullYear()) * 12 + (target.getMonth() - start.getMonth());
      return md % n === 0;
    }
    if (unit === 'year') {
      if (target.getDate() !== start.getDate() || target.getMonth() !== start.getMonth()) return false;
      return (target.getFullYear() - start.getFullYear()) % n === 0;
    }
  }
  return false;
}

function getMemosForDay(ds) {
  return memos.filter(m => !m.done && memoOccursOn(m, ds));
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active',(i===0)===(tab==='cal')));
  document.getElementById('view-cal').classList.toggle('active', tab==='cal');
  document.getElementById('view-memo').classList.toggle('active', tab==='memo');
}

function openSheet() {
  document.getElementById('inp-date').value = todayStr;
  document.getElementById('inp-time').value = '';
  document.getElementById('inp-title').value = '';
  document.getElementById('inp-desc').value = '';
  document.getElementById('inp-interval').value = 1;
  pickRepeatByVal('none');
  document.getElementById('overlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
  setTimeout(() => document.getElementById('inp-title').focus(), 350);
}
function closeSheet() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}

function pickTag(el) {
  document.querySelectorAll('.tag-opt').forEach(t => t.className = 'tag-opt');
  selectedTag = el.dataset.tag;
  el.classList.add('sel-' + selectedTag);
}

function pickRepeat(el) { pickRepeatByVal(el.dataset.repeat); }
function pickRepeatByVal(val) {
  selectedRepeat = val;
  document.querySelectorAll('.repeat-opt').forEach(t => t.classList.toggle('active', t.dataset.repeat === val));
  document.getElementById('custom-interval').classList.toggle('show', val === 'custom');
}

function addMemo() {
  const title = document.getElementById('inp-title').value.trim();
  if (!title) { document.getElementById('inp-title').focus(); return; }
  memos.unshift({
    id: Date.now(), title,
    desc: document.getElementById('inp-desc').value.trim(),
    date: document.getElementById('inp-date').value,
    time: document.getElementById('inp-time').value,
    tag: selectedTag,
    repeat: selectedRepeat,
    repeatInterval: document.getElementById('inp-interval').value,
    repeatUnit: document.getElementById('inp-interval-unit').value,
    done: false, created: todayStr
  });
  save(); renderMemos(); renderCalendar();
  if (selectedDay) showDayDetail(selectedDay);
  closeSheet();
}

function deleteMemo(id) {
  if (!confirm('刪除這則備忘錄？')) return;
  memos = memos.filter(m => m.id !== id);
  save(); renderMemos(); renderCalendar();
  if (selectedDay) showDayDetail(selectedDay);
}

function toggleDone(id) {
  const m = memos.find(m => m.id === id);
  if (m) { m.done = !m.done; save(); renderMemos(); renderCalendar(); }
}

function setFilter(el) {
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active'); currentFilter = el.dataset.filter; renderMemos();
}

function tagLabel(t) { return {work:'工作',personal:'個人',urgent:'緊急'}[t]||''; }
function escHtml(s) { return s?(s+'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''; }

function showDayDetail(ds) {
  selectedDay = ds;
  const wdays = ['日','一','二','三','四','五','六'];
  const d = new Date(ds + 'T00:00:00');
  document.getElementById('day-detail-title').textContent = `${d.getMonth()+1} 月 ${d.getDate()} 日（${wdays[d.getDay()]}）`;
  const dayMemos = getMemosForDay(ds).sort((a,b) => (a.time||'99:99') > (b.time||'99:99') ? 1 : -1);
  document.getElementById('day-detail-list').innerHTML = dayMemos.length
    ? dayMemos.map(m => {
        const rl = repeatLabel(m);
        return `<div class="detail-item">
          <div class="detail-dot ${m.tag||'none'}"></div>
          <div class="detail-info">
            <div class="detail-title">${escHtml(m.title)}</div>
            <div class="detail-meta">${m.time?m.time+'　':''}${m.tag?tagLabel(m.tag):''}</div>
            ${rl?`<div class="detail-repeat">↻ ${rl}</div>`:''}
          </div>
        </div>`;
      }).join('')
    : '<div style="font-size:12px;color:var(--text3);padding:8px 0;">這天沒有事項</div>';
  document.getElementById('day-detail').style.display = 'block';
  renderCalendar();
}

function renderMemos() {
  const el = document.getElementById('memo-list');
  let list = currentFilter === 'all' ? memos : memos.filter(m => m.tag === currentFilter);
  const active = list.filter(m => !m.done), done = list.filter(m => m.done);
  if (!list.length) { el.innerHTML = '<div class="empty">尚無備忘錄<br>點右上角 + 新增</div>'; return; }
  const card = m => {
    const rl = repeatLabel(m);
    return `<div class="memo-card ${m.done?'done':''}">
      <div class="memo-card-top">
        <button class="check-btn ${m.done?'checked':''}" onclick="toggleDone(${m.id})"></button>
        <span class="memo-title">${escHtml(m.title)}</span>
      </div>
      ${m.desc?`<div class="memo-desc">${escHtml(m.desc)}</div>`:''}
      <div class="memo-meta">
        ${m.tag?`<span class="memo-tag ${m.tag}">${tagLabel(m.tag)}</span>`:''}
        ${m.date?`<span class="memo-date ${m.date===todayStr?'today':''}">${m.time?m.time+' · ':''}${m.date===todayStr?'今天':m.date}</span>`:''}
        ${rl?`<span class="memo-repeat-badge">↻ ${rl}</span>`:''}
      </div>
      <button class="del-btn" onclick="deleteMemo(${m.id})">✕</button>
    </div>`;
  };
  let html = '';
  if (active.length) html += `<div class="section-label">進行中 · ${active.length}</div>` + active.map(card).join('');
  if (done.length) html += `<div class="section-label" style="margin-top:16px;">已完成 · ${done.length}</div>` + done.map(card).join('');
  el.innerHTML = html;
}

function renderCalendar() {
  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('cal-month').textContent = `${viewYear} 年 ${monthNames[viewMonth]}`;
  const first = new Date(viewYear, viewMonth, 1).getDay();
  const days = new Date(viewYear, viewMonth+1, 0).getDate();
  const prevDays = new Date(viewYear, viewMonth, 0).getDate();
  let html = '';
  for (let i=0;i<first;i++) html += `<div class="cal-day other"><div class="day-num">${prevDays-first+1+i}</div></div>`;
  for (let d=1;d<=days;d++) {
    const ds = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = ds===todayStr, isSel = ds===selectedDay;
    const dm = getMemosForDay(ds).sort((a,b)=>(a.time||'99:99')>(b.time||'99:99')?1:-1);
    const shown = dm.slice(0,2), extra = dm.length-shown.length;
    const items = shown.map(m => {
      const cls = m.tag==='work'?'work':m.tag==='personal'?'personal':m.tag==='urgent'?'urgent':'none';
      const t = m.time?`<span class="day-item-time">${m.time}</span>`:'';
      return `<div class="day-item ${cls}">${t}${escHtml(m.title)}</div>`;
    }).join('');
    html += `<div class="cal-day${isToday?' today':''}${dm.length?' has-memo':''}${isSel?' selected':''}" onclick="showDayDetail('${ds}')">
      <div class="day-num">${d}</div>${items}${extra>0?`<div class="day-more">+${extra}</div>`:''}
    </div>`;
  }
  const remain = 42-first-days;
  for (let d=1;d<=remain;d++) html += `<div class="cal-day other"><div class="day-num">${d}</div></div>`;
  document.getElementById('cal-grid').innerHTML = html;
}

function changeMonth(d) {
  viewMonth+=d;
  if(viewMonth>11){viewMonth=0;viewYear++;}
  if(viewMonth<0){viewMonth=11;viewYear--;}
  selectedDay=null;
  document.getElementById('day-detail').style.display='none';
  renderCalendar();
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
renderCalendar();
renderMemos();
</script>
</body>
</html>
